<div class="app" aria-hidden="true">
      <div class="win"><span></span><span></span><span></span></div>
      <div class="cols">
        <div class="rail">
          <span class="r logo"><img src="site/logo.svg" alt=""></span>
          <span class="sep"></span>
          <span class="r on c1"></span>
          <span class="r c2"></span>
          <span class="r c3"><i class="badge"></i></span>
          <span class="r add"></span>
        </div>
        <div class="side">
          <span class="srv"><span class="bar t w60"></span><span class="chev"></span></span>
          <span class="cat w40"></span>
          <span class="ch"><b>#</b><span class="bar w55"></span></span>
          <span class="ch unread"><b>#</b><span class="bar w40"></span></span>
          <span class="ch"><b>#</b><span class="bar w50"></span></span>
          <span class="cat w35"></span>
          <span class="ch on"><i class="spk"></i><span class="bar w45"></span></span>
          <span class="who" data-who="0"><i class="p1"></i><span class="bar w40"></span></span>
          <span class="who" data-who="1"><i class="p2"></i><span class="bar w30"></span></span>
          <span class="who" data-who="2"><i class="p3"></i><span class="bar w45"></span><i class="mute"></i></span>
          <span class="who" data-who="3"><i class="p4"></i><span class="bar w35"></span></span>
          <span class="ch"><i class="spk"></i><span class="bar w35"></span></span>
          <span class="grow"></span>
          <span class="vp"><span class="ok"></span><span class="bar w45"></span><span class="tools"><i></i><i></i><i></i></span></span>
          <span class="me"><i class="p1"></i><span class="lines"><span class="bar w60"></span><span class="bar w40 dim"></span></span></span>
        </div>
        <div class="main">
          <div class="head"><i class="spk"></i><span class="bar w20 t"></span><span class="bar w10 dim"></span><span class="grow"></span><span class="search"></span></div>
          <div class="stage">
            <div class="tile" data-who="0"><i class="p1"></i><span class="tag"></span></div>
            <div class="tile cam" data-who="1"><span class="tag"></span></div>
            <div class="tile" data-who="2"><i class="p3"></i><span class="tag"></span><i class="mute"></i></div>
            <div class="tile" data-who="3"><i class="p4"></i><span class="tag"></span></div>
          </div>
        </div>
        <div class="chat">
          <div class="msgs" id="msgs">
            <div class="msg"><i class="p2"></i><span><span class="bar n w30"></span><span class="bar w85"></span></span></div>
            <div class="msg"><i class="p4"></i><span><span class="bar n w25"></span><span class="bar w60"></span></span></div>
            <div class="msg"><i class="p3"></i><span><span class="bar n w35"></span><span class="bar w75"></span><span class="bar w45"></span><span class="react"></span></span></div>
          </div>
          <div class="typing"><i></i><i></i><i></i></div>
          <div class="box"><span class="plus"></span></div>
        </div>
      </div>
    </div>
