[package]
name = "strom-voice"
version = "0.1.0"
edition = "2021"

[dependencies]
strom-shared = { path = "../shared" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = "0.5"
bip39 = "2"
chacha20poly1305 = "0.10"
cpal = "0.15"
opus = "0.3"
nnnoiseless = { version = "0.5", default-features = false }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sonora = "0.2.0"
sha2 = "0.10"
socket2 = "0.6"
# TURN (relay) logins: HMAC-SHA1 keyed with MD5, as the standard says.
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"

# The computer's sound for a shared screen (all but Hopp itself).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant"] }
windows-core = "0.62"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
strom-server = { path = "../server" }
